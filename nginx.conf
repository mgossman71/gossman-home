server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip for HTML/CSS/JS.
    gzip on;
    gzip_types text/plain text/html application/javascript text/css application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the document itself uncached (it changes whenever a site is added).
    # add_header directives do not inherit into a location that defines its own,
    # so the security headers are restated here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}